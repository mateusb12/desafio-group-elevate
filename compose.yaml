services:
  backend:
    build: ./backend
    environment:
      SEED_DEMO: "1"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-local-demo-only-change-me-with-32-plus-bytes}"
    command: flask --app app run --debug --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/ping', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
