services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elevate
      POSTGRES_USER: elevate
      POSTGRES_PASSWORD: elevate-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevate -d elevate"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-elevate}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-elevate-local-only}"
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrations:
    build: ./backend
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: "postgresql+psycopg://elevate:elevate-local-only@db:5432/elevate"
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  backend:
    build: ./backend
    environment:
      SEED_DEMO: "1"
      RESET_DEMO: "${RESET_DEMO:-0}"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: "postgresql+psycopg://elevate:elevate-local-only@db:5432/elevate"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-local-demo-only-change-me-with-32-plus-bytes}"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: flask --app app run --debug --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/ping', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  outbox-service:
    build: ./backend
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: "postgresql+psycopg://elevate:elevate-local-only@db:5432/elevate"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "${RABBITMQ_DEFAULT_USER:-elevate}"
      RABBITMQ_PASSWORD: "${RABBITMQ_DEFAULT_PASS:-elevate-local-only}"
      OUTBOX_BATCH_SIZE: "10"
      OUTBOX_POLL_INTERVAL_SECONDS: "2"
      OUTBOX_RETRY_INITIAL_SECONDS: "1"
      OUTBOX_RETRY_MAX_SECONDS: "30"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: python -m features.outbox.publisher
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy

  logicall:
    build: ./simulators/callcenter
    environment:
      CALL_CENTER_NAME: Logicall
      CALL_CENTER_ID: call-center-a
      PORT: "8101"
    ports:
      - "127.0.0.1:8101:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8101/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  salesbound:
    build: ./simulators/callcenter
    environment:
      CALL_CENTER_NAME: Salesbound
      CALL_CENTER_ID: call-center-b
      PORT: "8102"
    ports:
      - "127.0.0.1:8102:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8102/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  atendemais:
    build: ./simulators/callcenter
    environment:
      CALL_CENTER_NAME: AtendeMais
      CALL_CENTER_ID: call-center-c
      PORT: "8103"
    ports:
      - "127.0.0.1:8103:8103"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8103/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
