services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elevate
      POSTGRES_USER: elevate
      POSTGRES_PASSWORD: elevate-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevate -d elevate"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrations:
    build: ./backend
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: "postgresql+psycopg://elevate:elevate-local-only@db:5432/elevate"
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  backend:
    build: ./backend
    environment:
      SEED_DEMO: "1"
      RESET_DEMO: "${RESET_DEMO:-0}"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: "postgresql+psycopg://elevate:elevate-local-only@db:5432/elevate"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-local-demo-only-change-me-with-32-plus-bytes}"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: flask --app app run --debug --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/ping', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
